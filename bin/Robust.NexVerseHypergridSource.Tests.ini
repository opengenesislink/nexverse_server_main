; CI-only source HomeAgent service for NexVerse Hypergrid end-to-end validation.

[Const]
    BaseHostname = "127.0.0.1"
    BaseURL = "http://${Const|BaseHostname}"
    PublicPort = "19200"
    PrivatePort = "19200"

[Startup]
    RegistryLocation = "."
    ConfigDirectory = "."
    console = "mock"
    ConsoleHistoryFileEnabled = false

[ServiceList]
    UserAgentServerConnector = "${Const|PublicPort}/OpenSim.Server.Handlers.dll:UserAgentServerConnector"
    HeloServiceInConnector = "${Const|PublicPort}/OpenSim.Server.Handlers.dll:HeloServiceInConnector"

[Network]
    port = ${Const|PublicPort}
    AllowllHTTPRequestIn = false

[DatabaseService]
    StorageProvider = "OpenSim.Data.SQLite.dll"
    ConnectionString = "URI=file:/tmp/nexverse-hg-source.db,version=3,UseUTF16Encoding=True"

[Hypergrid]
    GatekeeperURI = "http://127.0.0.1:19200"
    HomeURI = "http://127.0.0.1:19200"

[GridService]
    LocalServiceModule = "OpenSim.Services.GridService.dll:GridService"
    StorageProvider = "OpenSim.Data.Null.dll:NullRegionData"
    HypergridLinker = true
    AllowHypergridMapSearch = true

[GridUserService]
    LocalServiceModule = "OpenSim.Services.UserAccountService.dll:GridUserService"

[UserAccountService]
    LocalServiceModule = "OpenSim.Services.UserAccountService.dll:UserAccountService"
    CreateDefaultAvatarEntries = false

[PresenceService]
    LocalServiceModule = "OpenSim.Services.PresenceService.dll:PresenceService"
    StorageProvider = "OpenSim.Data.Null.dll"
    AllowDuplicatePresences = false

[FriendsService]
    LocalServiceModule = "OpenSim.Services.FriendsService.dll:FriendsService"

[GatekeeperService]
    LocalServiceModule = "OpenSim.Services.HypergridService.dll:GatekeeperService"
    UserAccountService = "OpenSim.Services.UserAccountService.dll:UserAccountService"
    UserAgentService = "OpenSim.Services.HypergridService.dll:UserAgentService"
    PresenceService = "OpenSim.Services.PresenceService.dll:PresenceService"
    GridUserService = "OpenSim.Services.UserAccountService.dll:GridUserService"
    GridService = "OpenSim.Services.GridService.dll:GridService"
    SimulationService = "OpenSim.Services.Connectors.dll:SimulationServiceConnector"
    ExternalName = "http://127.0.0.1:19200"
    AllowTeleportsToAnyRegion = true

[UserAgentService]
    LocalServiceModule = "OpenSim.Services.HypergridService.dll:UserAgentService"
    GridUserService = "OpenSim.Services.UserAccountService.dll:GridUserService"
    GridService = "OpenSim.Services.GridService.dll:GridService"
    GatekeeperService = "OpenSim.Services.HypergridService.dll:GatekeeperService"
    PresenceService = "OpenSim.Services.PresenceService.dll:PresenceService"
    FriendsService = "OpenSim.Services.FriendsService.dll:FriendsService"
    UserAccountService = "OpenSim.Services.UserAccountService.dll:UserAccountService"
    ExternalName = "http://127.0.0.1:19200"
    BypassClientVerification = true
