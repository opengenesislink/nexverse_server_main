; CI-only destination simulator for real Hypergrid HomeAgent/Gatekeeper validation.

[Const]
    BaseHostname = "127.0.0.1"
    BaseURL = "http://${Const|BaseHostname}"
    PublicPort = "19300"
    PrivatePort = "19300"

[Startup]
    background = true
    RegistryLocation = "."
    ConfigDirectory = "."
    ConsoleHistoryFileEnabled = false
    region_info_source = "filesystem"
    regionload_regionsdir = "../tools/ci/NexHypergrid/Regions"
    regionload_estatesdir = "../tools/ci/NexHypergrid/Estates"
    physics = "BulletSim"
    meshing = "Meshmerizer"

[Network]
    http_listener_port = 19300
    ExternalHostName = "127.0.0.1"
    AllowllHTTPRequestIn = false

[Map]
    GenerateMaptiles = false
    MapImageModule = "Warp3DImageModule"

[XMLRPC]
    XmlRpcPort = 0

[Architecture]
    Include-Architecture = "config-include/StandaloneHypergrid.ini"
