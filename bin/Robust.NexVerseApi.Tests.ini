; NexVerse World API runtime smoke-test configuration.
; This file intentionally starts only the public read-only World API.

[Const]
    PublicPort = "19090"
    PrivatePort = "19091"

[Startup]
    RegistryLocation = "."
    ConfigDirectory = "robust-include"
    console = "mock"
    ConsoleHistoryFileEnabled = false

[ServiceList]
    NexVerseWorldApiConnector = "NexVerseWorldApi@${Const|PublicPort}/NexVerse.Server.Api.dll:NexVerseWorldApiConnector"

[Network]
    port = ${Const|PrivatePort}
    AllowllHTTPRequestIn = false

[NexVerseWorldApi]
    Enabled = true
    PublicBaseUrl = "http://127.0.0.1:19090"
    EnablePrivilegedEndpoints = false
    AdminMinimumUserLevel = 200
    TokenLifetimeSeconds = 1800
