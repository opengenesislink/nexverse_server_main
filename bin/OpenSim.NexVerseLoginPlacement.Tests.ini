; NexVerse CI-only successful Firestorm-protocol login placement configuration.
; Uses temporary SQLite state under /tmp and one real OpenSim region process.

[Const]
    BaseHostname = "127.0.0.1"
    BaseURL = "http://${Const|BaseHostname}"
    PublicPort = "19100"
    PrivatePort = "19100"

[Startup]
    RegistryLocation = "."
    ConfigDirectory = "."
    console = "mock"
    ConsoleHistoryFileEnabled = false
    region_info_source = "filesystem"
    regionload_regionsdir = "../tools/ci/NexLoginPlacement/Regions"
    regionload_estatesdir = "../tools/ci/NexLoginPlacement/Estates"
    physics = "BulletSim"
    meshing = "Meshmerizer"

[Network]
    http_listener_port = 19100
    ExternalHostName = "127.0.0.1"
    AllowllHTTPRequestIn = false

[Map]
    GenerateMaptiles = false
    MapImageModule = "Warp3DImageModule"

[XMLRPC]
    XmlRpcPort = 0

[Architecture]
    Include-Architecture = "config-include/Standalone.ini"
