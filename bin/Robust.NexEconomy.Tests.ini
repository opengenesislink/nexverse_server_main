; CI-only Robust profile for the native OpenGenesisLINK NV$ ledger bootstrap.

[Const]
    BaseURL = "http://127.0.0.1"
    PrivatePort = "19490"
    PublicPort = "19490"

[Startup]
    ConsolePrompt = "NexEconomy CI "

[ServiceList]
    NexEconomyConnector = "NexEconomy@${Const|PrivatePort}/NexVerse.Server.Api.dll:NexEconomyConnector"

[Network]
    port = ${Const|PrivatePort}
    AllowllHTTPRequestIn = false

[DatabaseService]
    StorageProvider = "OpenSim.Data.SQLite.dll"
    ConnectionString = "URI=file:/tmp/opengenesislink-economy-ci.db,version=3"

[NexEconomy]
    Enabled = true
    StorageProvider = ""
    ConnectionString = ""
    InitializeSchema = true
