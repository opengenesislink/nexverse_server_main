; NexVerse full OSSL runtime profile.
; Loaded after osslDefaultEnable.ini and intentionally kept separate from upstream defaults.
;
; Goal:
; - expose the complete current OSSL function surface;
; - keep low-risk/default OSSL behavior compatible;
; - require trusted roles for force/admin functions;
; - prevent newly introduced OSSL functions from becoming implicitly available before review.
;
; Do not replace OSFunctionThreatLevel=NoAccess with Severe.  Current functions are
; explicitly allowed either by osslDefaultEnable.ini or by the overrides below.

[OSSL]
  AllowOSFunctions = true
  AllowMODFunctions = true
  AllowLightShareFunctions = true

  ; Permission errors should be sent only to the object owner.
  PermissionErrorToOwner = true

  ; Secure-by-default gate.  The current OSSL surface is explicitly covered by
  ; upstream Allow_* rules plus the NexVerse overrides below.
  OSFunctionThreatLevel = NoAccess

  ; Do not automatically grant privileged OSSL calls merely because someone owns
  ; a parcel or belongs to the parcel group.  Estate roles remain the trust boundary.
  osslParcelO = ""
  osslParcelOG = ""
  osslNPC = ESTATE_MANAGER,ESTATE_OWNER

  ; ---------------------------------------------------------------------------
  ; Upstream functions that are disabled by default.
  ; NexVerse enables them, but keeps force operations restricted.
  ; ---------------------------------------------------------------------------

  ; PMAC and other established pose systems need to start/stop animations on
  ; participating avatars without requiring estate ownership.  These two
  ; animation helpers are therefore grid-wide.  The actual force-attach/sit
  ; functions below remain restricted to trusted estate roles.
  Allow_osAvatarPlayAnimation = true
  Allow_osAvatarStopAnimation = true
  Allow_osForceAttachToOtherAvatarFromInventory = ESTATE_MANAGER,ESTATE_OWNER
  Allow_osForceDetachFromAvatar = ESTATE_MANAGER,ESTATE_OWNER
  Allow_osForceOtherSit = ESTATE_MANAGER,ESTATE_OWNER
  Allow_osSetRot = ESTATE_MANAGER,ESTATE_OWNER

  ; Simulator console access is the most privileged OSSL capability.
  Allow_osConsoleCommand = GRID_GOD

  ; HTTP response content-type control is enabled for trusted estate roles.
  Allow_osSetContentType = ESTATE_MANAGER,ESTATE_OWNER

  ; ---------------------------------------------------------------------------
  ; Current OSSL implementation functions that do not have active rules in the
  ; inherited default file.  Explicit rules ensure NoAccess does not disable them.
  ; ---------------------------------------------------------------------------

  Allow_osTerrainSetHeight = ESTATE_MANAGER,ESTATE_OWNER
  Allow_osSunGetParam = true
  Allow_osSunSetParam = ESTATE_MANAGER,ESTATE_OWNER
  Allow_osWindActiveModelPluginName = true
  Allow_osGetGender = true
  Allow_osGetHealth = true
  Allow_osGetHealRate = true
  Allow_osGetRezzingObject = true

  ; Compatibility-critical read-only notecard helpers used by established
  ; OpenSim content such as PMAC.  The inherited upstream profile restricts
  ; these VeryHigh functions to estate roles because they perform synchronous
  ; asset reads.  NexVerse explicitly allows them grid-wide so ordinary
  ; scripted products can operate without estate-manager ownership.
  Allow_osGetNotecard = true
  Allow_osGetNotecardLine = true
  Allow_osGetNumberOfNotecardLines = true
