name: Import OpenSimulator 0.9.3.0 baseline

on:
  push:
    paths:
      - ".github/workflows/import-opensim-baseline.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NexVerse repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download and verify OpenSimulator 0.9.3.0 source release
        shell: bash
        run: |
          set -euo pipefail
          url="https://opensimulator.dev/dist/opensim-0.9.3.0-source.tar.gz"
          expected="8dc78639e47859e76a36a03304c1d44c905aac7807f44c1c0af671d156342eab"
          curl --fail --location --retry 5 --retry-delay 3 "$url" -o /tmp/opensim-source.tar.gz
          actual="$(sha256sum /tmp/opensim-source.tar.gz | awk '{print $1}')"
          test "$actual" = "$expected" || {
            echo "SHA-256 mismatch: expected $expected, got $actual" >&2
            exit 1
          }
          mkdir -p /tmp/opensim-source
          tar -xzf /tmp/opensim-source.tar.gz -C /tmp/opensim-source --strip-components=1

      - name: Import baseline and NexVerse project metadata
        shell: bash
        run: |
          set -euo pipefail

          # Keep Git metadata and this one-shot bootstrap workflow, replace all other
          # tracked/untracked project files with the published OpenSimulator baseline.
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/opensim-source/. .

          cat > README.md <<'EOF'
          # NexVerse Server

          NexVerse Server is an independent virtual-world server platform developed by OpenGenesisLink.

          This repository starts from the published **OpenSimulator 0.9.3.0 ("Nessie") Release** source package. It is intentionally maintained as its own repository rather than as a GitHub fork. The long-term objective is an independent NexVerse development line whose architecture, services, protocols, modules, tooling and branding may diverge substantially from OpenSimulator.

          ## Upstream baseline

          - Upstream project: OpenSimulator
          - Baseline release: 0.9.3.0 ("Nessie" Release)
          - Release date: 8 November 2024
          - Imported archive: `opensim-0.9.3.0-source.tar.gz`
          - SHA-256: `8dc78639e47859e76a36a03304c1d44c905aac7807f44c1c0af671d156342eab`
          - Original OpenSimulator notices remain in the source tree, including `LICENSE.txt`, `CONTRIBUTORS.txt` and third-party notices.

          ## NexVerse licensing

          New original NexVerse contributions are licensed under the **Mozilla Public License 2.0 (MPL-2.0)** unless a file or directory explicitly states otherwise.

          Imported OpenSimulator files do **not** lose or replace their existing BSD/third-party licensing. NexVerse changes to inherited files must preserve all applicable notices. See `LICENSE_POLICY.md` and `NOTICE.md`.

          ## Development model

          NexVerse Server is a continuation and substantial independent development based on the OpenSimulator 0.9.3.0 source baseline. Compatibility with OpenSimulator and Second Life protocols may be retained where useful, but NexVerse is expected to develop its own components and implementation choices over time.

          ## Build baseline

          OpenSimulator 0.9.3.0 uses the .NET 8 SDK. The original build instructions are retained in this repository.
          EOF

          cat > LICENSE_POLICY.md <<'EOF'
          # NexVerse Server licensing policy

          ## New NexVerse code

          Original source files and substantial original additions authored for NexVerse Server are made available under the Mozilla Public License Version 2.0 (MPL-2.0), unless an individual file or directory contains a different explicit license notice.

          ## Imported OpenSimulator code

          This repository began from the published OpenSimulator 0.9.3.0 source release. That inherited code remains subject to its original copyright, BSD license terms, contributor notices, and any applicable third-party licenses. Those notices must not be removed merely because the repository is developed under the NexVerse name.

          MPL-2.0 applies to new NexVerse-covered files and modifications to the extent legally applicable; it does not erase or supersede pre-existing third-party rights or license obligations.

          ## Third-party components

          Third-party libraries, generated material, assets, and bundled components remain under their respective licenses. Consult the notices shipped in the source tree before redistributing or relicensing a component.

          ## Contributions

          Unless explicitly stated otherwise when submitted, contributions intended for NexVerse-owned files are accepted under MPL-2.0. Contributors must not submit code they do not have the right to license.

          This file describes the project's intended licensing structure and is not legal advice.
          EOF

          cat > NOTICE.md <<'EOF'
          # Notices and provenance

          NexVerse Server is an independent development project maintained by OpenGenesisLink.

          Initial source baseline:
          - OpenSimulator 0.9.3.0 ("Nessie" Release)
          - Published 8 November 2024
          - Source archive: opensim-0.9.3.0-source.tar.gz
          - SHA-256: 8dc78639e47859e76a36a03304c1d44c905aac7807f44c1c0af671d156342eab
          - Upstream project: https://opensimulator.org/

          OpenSimulator-origin files retain their original copyright and license notices. See LICENSE.txt and CONTRIBUTORS.txt in this repository.

          NexVerse is not represented as the OpenSimulator Project and the OpenSimulator name is not used to imply endorsement.
          EOF

          curl --fail --location --retry 3             https://raw.githubusercontent.com/spdx/license-list-data/main/text/MPL-2.0.txt             -o LICENSE

          cat > .gitattributes <<'EOF'
          * text=auto
          *.sh text eol=lf
          *.bat text eol=crlf
          *.cmd text eol=crlf
          *.cs text eol=lf
          *.csproj text eol=lf
          *.sln text eol=crlf
          EOF

      - name: Commit complete baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "NexVerse Bootstrap"
          git config user.email "noreply@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No import changes to commit."
            exit 0
          fi
          git commit -m "Import OpenSimulator 0.9.3.0 baseline for NexVerse"
          git push origin HEAD:main
