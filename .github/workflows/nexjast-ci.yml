name: NexVerse CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build NexVerse
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify repository hygiene
        shell: bash
        run: |
          set -euo pipefail

          if git ls-files | grep -E '(^|/)obj/' >/dev/null; then
            echo "::error::Tracked obj/ build intermediates found."
            git ls-files | grep -E '(^|/)obj/'
            exit 1
          fi

          forbidden_paths=(
            "OpenSim/ApplicationPlugins/RemoteController"
            "OpenSim/Region/OptionalModules/Avatar/Voice/VivoxVoice"
            "OpenSim/Region/OptionalModules/Avatar/Voice/FreeSwitchVoice"
            "OpenSim/Region/OptionalModules/ServiceConnectorsIn/Freeswitch"
            "OpenSim/Server/Handlers/Freeswitch"
            "OpenSim/Services/Connectors/Freeswitch"
            "OpenSim/Services/FreeswitchService"
            "OpenSim/Region/OptionalModules/Avatar/Chat/IRCBridgeModule.cs"
            "OpenSim/Region/OptionalModules/Avatar/Chat/IRCConnector.cs"
            "OpenSim/Server/Handlers/Authentication/OpenIdServerConnector.cs"
            "OpenSim/Server/Handlers/Authentication/OpenIdServerHandler.cs"
            "OpenSim/Region/OptionalModules/UserStatistics"
            "OpenSim/Region/OptionalModules/Example"
          )

          for path in "${forbidden_paths[@]}"; do
            if [ -e "$path" ]; then
              echo "::error::Legacy component still exists: $path"
              exit 1
            fi
          done

          test -f OpenSim/Region/CoreModules/Scripting/XMLRPC/XMLRPCModule.cs
          test -f OpenSim/Region/OptionalModules/Scripting/XmlRpcRouterModule/XmlRpcRouterModule.cs

      - name: Verify runtime secrets are not committed
        shell: bash
        run: python3 tools/ci/verify_no_plaintext_runtime_secrets.py

      - name: Verify OSSL policy coverage
        shell: bash
        run: python3 tools/ci/verify_ossl_policy.py

      - name: Verify Hypergrid URI normalization
        shell: bash
        run: dotnet run --configuration Release --project tools/ci/HypergridUriRegression/HypergridUriRegression.csproj

      - name: Verify simulator runtime profile
        shell: bash
        run: python3 tools/ci/verify_simulator_runtime_profile.py

      - name: Verify account lifecycle policy
        shell: bash
        run: python3 tools/ci/verify_account_lifecycle.py

      - name: Verify resident username normalization
        shell: bash
        run: dotnet run --configuration Release --project tools/ci/NexResidentNameRegression/NexResidentNameRegression.csproj

      - name: Verify native access tokens
        shell: bash
        run: dotnet run --configuration Release --project tools/ci/NexTokenRegression/NexTokenRegression.csproj

      - name: Verify API rate limiter
        shell: bash
        run: dotnet run --configuration Release --project tools/ci/NexRateLimitRegression/NexRateLimitRegression.csproj

      - name: Verify persistent audit store
        shell: bash
        run: dotnet run --configuration Release --project tools/ci/NexAuditRegression/NexAuditRegression.csproj

      - name: Verify idempotency store
        shell: bash
        run: dotnet run --configuration Release --project tools/ci/NexIdempotencyRegression/NexIdempotencyRegression.csproj

      - name: Verify scoped API key store
        shell: bash
        run: dotnet run --configuration Release --project tools/ci/NexApiKeyRegression/NexApiKeyRegression.csproj

      - name: Verify OAuth2 OIDC identity flows
        shell: bash
        run: dotnet run --configuration Release --project tools/ci/NexOAuthRegression/NexOAuthRegression.csproj

      - name: Verify OAuth browser login and consent
        shell: bash
        run: python3 tools/ci/verify_oauth_browser_consent.py

      - name: Verify native auth cutover
        shell: bash
        run: python3 tools/ci/verify_native_auth_cutover.py

      - name: Verify Region Control Plane mutations
        shell: bash
        run: python3 tools/ci/verify_region_mutations.py

      - name: Verify NexBus distributed core
        shell: bash
        run: dotnet run --configuration Release --project tools/ci/NexBusRegression/NexBusRegression.csproj

      - name: Verify NodeAgent registry projection
        shell: bash
        run: dotnet run --configuration Release --project tools/ci/NexNodeRegistryRegression/NexNodeRegistryRegression.csproj

      - name: Verify NexMetrics OTLP pipeline
        shell: bash
        run: dotnet run --configuration Release --project tools/ci/NexMetricsRegression/NexMetricsRegression.csproj

      - name: Install native dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdiplus libc6-dev

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Generate project files
        shell: bash
        run: |
          chmod +x runprebuild.sh
          ./runprebuild.sh

      - name: Build Release
        shell: bash
        run: dotnet build --configuration Release OpenSim.sln

      - name: Verify NexVerse native assemblies
        shell: bash
        run: |
          test -f bin/NexVerse.Core.dll
          test -f bin/NexVerse.Server.Api.dll
          test -f bin/NexVerse.RegionModules.dll

      - name: Runtime regression local secret env loading
        shell: bash
        run: dotnet run --configuration Release --project tools/ci/NexRuntimeSecretRegression/NexRuntimeSecretRegression.csproj

      - name: Runtime smoke test successful simulator login placement
        shell: bash
        run: bash tools/ci/smoke_login_placement.sh

      - name: Runtime smoke test Hypergrid HomeAgent Gatekeeper login
        shell: bash
        run: bash tools/ci/smoke_hypergrid_login.sh

      - name: Runtime regression LSL XML-RPC RemoteData compatibility
        shell: bash
        run: dotnet run --configuration Release --project tools/ci/XmlRpcRemoteDataRegression/XmlRpcRemoteDataRegression.csproj

      - name: Verify NexVerse version
        shell: bash
        run: |
          grep -F 'public const string ProductName = "NexVerse";' OpenSim/Framework/VersionInfo.cs
          grep -F 'public const string VersionNumber = "0.9.3.2";' OpenSim/Framework/VersionInfo.cs
          grep -F 'public const Flavour VERSION_FLAVOUR = Flavour.Dev;' OpenSim/Framework/VersionInfo.cs

      - name: Runtime smoke test LLLogin protocol
        shell: bash
        run: bash tools/ci/smoke_lllogin_protocol.sh

      - name: Runtime smoke test World API
        shell: bash
        run: |
          set -euo pipefail
          cd bin

          dotnet Robust.dll -inifile Robust.NexVerseApi.Tests.ini > ../nexverse-api-smoke.log 2>&1 &
          ROBUST_PID=$!

          cleanup() {
            kill "$ROBUST_PID" 2>/dev/null || true
            wait "$ROBUST_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0
          for i in $(seq 1 40); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:19090/api/v1/health > /tmp/nexverse-health.json; then
              READY=1
              break
            fi

            if ! kill -0 "$ROBUST_PID" 2>/dev/null; then
              echo "::error::Robust exited before World API became ready."
              cat ../nexverse-api-smoke.log
              exit 1
            fi

            sleep 0.25
          done

          if [ "$READY" -ne 1 ]; then
            echo "::error::World API did not become ready."
            cat ../nexverse-api-smoke.log
            exit 1
          fi

          grep -F '"status": "ok"' /tmp/nexverse-health.json

          curl --silent --fail --max-time 2 http://127.0.0.1:19090/api/v1/version > /tmp/nexverse-version.json
          grep -F '"server_version": "NexVerse 0.9.3.2 Dev"' /tmp/nexverse-version.json
          grep -F '"api_version": "v1"' /tmp/nexverse-version.json
          grep -F '"language": "de-DE"' /tmp/nexverse-version.json

          curl --silent --fail --max-time 2 http://127.0.0.1:19090/api/v1/openapi.json > /tmp/nexverse-openapi.json
          grep -F '"openapi": "3.1.0"' /tmp/nexverse-openapi.json

          python3 - <<'PY'
          import json

          with open("/tmp/nexverse-openapi.json", "r", encoding="utf-8") as handle:
              doc = json.load(handle)

          schemas = doc["components"]["schemas"]
          for required in (
              "Error",
              "Pagination",
              "User",
              "Region",
              "GridRegionPlacement",
              "GridCell",
              "GridLayoutResponse",
              "GridCellResponse",
              "GridPlacementValidationResponse",
              "NodeRegion",
              "Node",
              "NodeListResponse",
              "NodeResponse",
              "RegionCreateRequest",
              "RegionPlacementRequest",
              "RegionLifecycleRequest",
              "RegionOperation",
              "RegionMutationAcceptedResponse",
              "RegionOperationResponse",
              "UserCreateRequest",
              "UserCreateResponse",
              "ApiKey",
              "AuditEvent",
          ):
              assert required in schemas, f"missing OpenAPI schema: {required}"

          user_post = doc["paths"]["/api/v1/users"]["post"]
          assert user_post["requestBody"]["content"]["application/json"]["schema"]["$ref"] == "#/components/schemas/UserCreateRequest"
          assert user_post["responses"]["201"]["content"]["application/json"]["schema"]["$ref"] == "#/components/schemas/UserCreateResponse"

          region_get = doc["paths"]["/api/v1/regions"]["get"]
          assert region_get["responses"]["200"]["content"]["application/json"]["schema"]["$ref"] == "#/components/schemas/RegionSearchResponse"

          region_post = doc["paths"]["/api/v1/regions"]["post"]
          assert region_post["x-nexverse-scope"] == "regions:manage"
          assert region_post["requestBody"]["content"]["application/json"]["schema"]["$ref"] == "#/components/schemas/RegionCreateRequest"
          assert region_post["responses"]["202"]["content"]["application/json"]["schema"]["$ref"] == "#/components/schemas/RegionMutationAcceptedResponse"

          placement_patch = doc["paths"]["/api/v1/regions/{regionId}/placement"]["patch"]
          assert placement_patch["x-nexverse-scope"] == "regions:manage"
          assert placement_patch["requestBody"]["content"]["application/json"]["schema"]["$ref"] == "#/components/schemas/RegionPlacementRequest"
          assert placement_patch["responses"]["202"]["content"]["application/json"]["schema"]["$ref"] == "#/components/schemas/RegionMutationAcceptedResponse"

          lifecycle_post = doc["paths"]["/api/v1/regions/{regionId}/lifecycle"]["post"]
          assert lifecycle_post["x-nexverse-scope"] == "regions:manage"
          assert lifecycle_post["requestBody"]["content"]["application/json"]["schema"]["$ref"] == "#/components/schemas/RegionLifecycleRequest"
          assert lifecycle_post["responses"]["202"]["content"]["application/json"]["schema"]["$ref"] == "#/components/schemas/RegionMutationAcceptedResponse"
          assert {p["name"] for p in lifecycle_post["parameters"]} == {"regionId", "Idempotency-Key"}
          assert schemas["RegionLifecycleRequest"]["properties"]["action"]["enum"] == ["start", "stop", "restart"]
          assert schemas["RegionOperation"]["properties"]["operation"]["enum"] == ["create", "move", "start", "stop", "restart"]

          operation_get = doc["paths"]["/api/v1/region-operations/{operationId}"]["get"]
          assert operation_get["x-nexverse-scope"] == "regions:read"
          assert operation_get["responses"]["200"]["content"]["application/json"]["schema"]["$ref"] == "#/components/schemas/RegionOperationResponse"

          grid_layout = doc["paths"]["/api/v1/grid/layout"]["get"]
          assert grid_layout["x-nexverse-scope"] == "regions:read"
          assert grid_layout["responses"]["200"]["content"]["application/json"]["schema"]["$ref"] == "#/components/schemas/GridLayoutResponse"
          assert {p["name"] for p in grid_layout["parameters"]} == {"min_x", "max_x", "min_y", "max_y"}
          assert all(p["schema"]["type"] == "integer" for p in grid_layout["parameters"])

          grid_cell = doc["paths"]["/api/v1/grid/cells/{x}/{y}"]["get"]
          assert grid_cell["responses"]["200"]["content"]["application/json"]["schema"]["$ref"] == "#/components/schemas/GridCellResponse"
          assert [p["name"] for p in grid_cell["parameters"]] == ["x", "y"]
          assert all(p["in"] == "path" and p["required"] for p in grid_cell["parameters"])

          placement = doc["paths"]["/api/v1/grid/validate-placement"]["get"]
          assert placement["responses"]["200"]["content"]["application/json"]["schema"]["$ref"] == "#/components/schemas/GridPlacementValidationResponse"
          assert {p["name"] for p in placement["parameters"]} == {"x", "y", "size_x", "size_y"}
          assert schemas["GridCell"]["properties"]["status"]["enum"] == ["free", "occupied", "reserved", "conflict"]
          assert schemas["GridRegionPlacement"]["properties"]["size_x"]["maximum"] == 4096
          for field in ("grid_x", "grid_y", "world_x", "world_y"):
              assert field in schemas["Region"]["required"], f"Region schema missing coordinate: {field}"
              assert schemas["Region"]["properties"][field]["type"] == "integer"
          assert "node_id" in schemas["GridRegionPlacement"]["properties"]
          assert "node_state" in schemas["GridRegionPlacement"]["properties"]
          assert schemas["Node"]["properties"]["managed_region_commands"]["type"] == "boolean"

          nodes_get = doc["paths"]["/api/v1/nodes"]["get"]
          assert nodes_get["x-nexverse-scope"] == "simulators:read"
          assert nodes_get["responses"]["200"]["content"]["application/json"]["schema"]["$ref"] == "#/components/schemas/NodeListResponse"
          node_get = doc["paths"]["/api/v1/nodes/{nodeId}"]["get"]
          assert node_get["x-nexverse-scope"] == "simulators:read"
          assert node_get["responses"]["200"]["content"]["application/json"]["schema"]["$ref"] == "#/components/schemas/NodeResponse"
          assert [p["name"] for p in node_get["parameters"]] == ["nodeId"]
          assert node_get["parameters"][0]["in"] == "path" and node_get["parameters"][0]["required"]
          assert schemas["Node"]["properties"]["state"]["enum"] == ["online", "stale", "offline"]

          assert doc["components"]["securitySchemes"]["apiKeyAuth"]["name"] == "X-NexVerse-Api-Key"
          assert doc["x_nexverse_idempotency"]["protected_operations"] == [
              "POST /api/v1/users",
              "POST /api/v1/regions",
              "PATCH /api/v1/regions/{regionId}/placement",
              "POST /api/v1/regions/{regionId}/lifecycle",
          ]
          assert "/api/v1/docs" in doc["paths"]
          assert doc["x_nexverse_language"] == "de-DE"
          assert doc["x_nexverse_version_history"][0]["api_version"] == "v1"
          assert doc["x_nexverse_version_history"][0]["server_line"] == "0.9.3.2"
          assert doc["x_nexverse_version_history"][0]["status"] == "development"
          assert doc["x_nexverse_changelog"]
          assert doc["x_nexverse_changelog"][0]["version"] == "0.9.3.2"
          assert "0.9.3.1 Dev" not in json.dumps(doc, ensure_ascii=False)
          assert "Resident and Hypergrid statistics dashboard" not in json.dumps(doc, ensure_ascii=False)
          assert "Legacy Cleanup and Platform Foundation" not in json.dumps(doc, ensure_ascii=False)
          assert doc["x_nexverse_changelog"][0]["status"] == "implemented"
          assert doc["x_nexverse_changelog"][0]["category"] == "regions"
          assert "/api/v1/regions" in doc["x_nexverse_changelog"][0]["endpoints"]
          assert "/api/v1/regions/{regionId}/lifecycle" in doc["x_nexverse_changelog"][0]["endpoints"]
          assert "/api/v1/region-operations/{operationId}" in doc["x_nexverse_changelog"][0]["endpoints"]
          assert "title" in doc["x_nexverse_changelog"][0]

          roadmap = doc["x_nexverse_roadmap"]
          assert roadmap["current_milestone"] == "0.9.3.2"
          assert roadmap["current_codename"] == ""
          milestones = {item["version"]: item for item in roadmap["milestones"]}
          assert milestones["0.9.3.1"]["status"] == "released"
          assert milestones["0.9.3.2"]["status"] == "active"
          assert milestones["0.9.3.3"]["status"] == "started"
          assert milestones["0.9.3.4"]["status"] == "foundation"
          assert milestones["0.9.3.6"]["status"] == "planned"

          from pathlib import Path
          roadmap_text = Path("../doc/NexVerse/ROADMAP.md").read_text(encoding="utf-8")
          sections = {}
          current = None
          for line in roadmap_text.splitlines():
              if line.startswith("# Milestone "):
                  current = line[len("# Milestone "):].strip()
                  sections[current] = {"completed": 0, "total": 0}
                  continue
              if current and (line.startswith("- [x]") or line.startswith("- [X]") or line.startswith("- [ ]")):
                  sections[current]["total"] += 1
                  if line.startswith("- [x]") or line.startswith("- [X]"):
                      sections[current]["completed"] += 1

          for source_name, api_version in (
              ("0.9.3.1 — NEXJAST", "0.9.3.1"),
              ("0.9.3.2", "0.9.3.2"),
              ("0.9.3.3", "0.9.3.3"),
          ):
              published = milestones[api_version]["checklist"]
              parsed = sections[source_name]
              assert published["completed"] == parsed["completed"]
              assert published["total"] == parsed["total"]
              assert published["open"] == parsed["total"] - parsed["completed"]

          stats_get = doc["paths"]["/api/v1/statistics/summary"]["get"]
          assert stats_get["x-nexverse-scope"] == "statistics:read"
          assert {} in stats_get["security"], "statistics aggregate mode must permit anonymous access"
          stats_schema = schemas["StatisticsSummaryResponse"]
          for required in ("detail_level", "protected_details"):
              assert required in stats_schema["required"], f"statistics schema missing required field: {required}"

          assert doc["paths"]["/api/v1/users"]["post"]["x-nexverse-audience"] == ["admin"]
          assert doc["paths"]["/api/v1/nodes"]["get"]["x-nexverse-audience"] == ["admin", "service"]
          assert "x-nexverse-ai-instruction" in doc["paths"]["/api/v1/users"]["post"]
          assert "x-nexverse-security-constraints" in doc["paths"]["/api/v1/users"]["post"]
          print("NexVerse OpenAPI 3.1 schema contract smoke: OK")
          PY

          STATS_STATUS=$(curl --silent --max-time 2 -o /tmp/nexverse-statistics.json -w '%{http_code}' http://127.0.0.1:19090/api/v1/statistics/summary)
          test "$STATS_STATUS" = "503"
          grep -F '"error": "statistics_data_unavailable"' /tmp/nexverse-statistics.json
          if [ "$STATS_STATUS" = "404" ]; then
            echo "::error::Statistics route disappeared while privileged endpoints are disabled."
            exit 1
          fi

          curl --silent --fail --max-time 2 http://127.0.0.1:19090/api/v1/docs > /tmp/nexverse-api-docs.html
          grep -F 'NexVerse Welt-API-Kontrollzentrum' /tmp/nexverse-api-docs.html
          grep -F 'Was ist neu?' /tmp/nexverse-api-docs.html
          grep -F 'NexVerse-Entwicklungsplan' /tmp/nexverse-api-docs.html
          grep -F 'Was ist neu?' /tmp/nexverse-api-docs.html
          grep -F 'NexVerse-Entwicklungsplan' /tmp/nexverse-api-docs.html
          grep -F 'x_nexverse_changelog' /tmp/nexverse-api-docs.html
          grep -F 'x_nexverse_roadmap' /tmp/nexverse-api-docs.html
          grep -F '/api/v1/openapi.json' /tmp/nexverse-api-docs.html
          grep -F 'Interaktiver Grid-Planer' /tmp/nexverse-api-docs.html
          grep -F '/api/v1/grid/layout' /tmp/nexverse-api-docs.html
          grep -F '/api/v1/grid/validate-placement' /tmp/nexverse-api-docs.html
          grep -F 'regions:read' /tmp/nexverse-api-docs.html
          grep -F 'Simulator-Nodes' /tmp/nexverse-api-docs.html
          grep -F '/api/v1/nodes' /tmp/nexverse-api-docs.html
          grep -F 'simulators:read' /tmp/nexverse-api-docs.html
          grep -F 'Region erstellen' /tmp/nexverse-api-docs.html
          grep -F 'createGridRegion' /tmp/nexverse-api-docs.html
          grep -F 'moveGridRegion' /tmp/nexverse-api-docs.html
          grep -F 'gridRegionSearch' /tmp/nexverse-api-docs.html
          grep -F 'jumpGridRegion' /tmp/nexverse-api-docs.html
          grep -F 'startGridRegion' /tmp/nexverse-api-docs.html
          grep -F 'stopGridRegion' /tmp/nexverse-api-docs.html
          grep -F 'restartGridRegion' /tmp/nexverse-api-docs.html
          grep -F '/api/v1/regions/' /tmp/nexverse-api-docs.html
          grep -F '/lifecycle' /tmp/nexverse-api-docs.html
          grep -F '/api/v1/region-operations/' /tmp/nexverse-api-docs.html
          if grep -F 'localStorage' /tmp/nexverse-api-docs.html; then
            echo "::error::API Control Center must not persist credentials in localStorage."
            exit 1
          fi
