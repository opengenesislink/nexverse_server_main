name: OGLVoice Go Media Gateway

on:
  pull_request:
    branches:
      - main
    paths:
      - 'services/oglvoice-media/**'
      - '.github/workflows/oglvoice-media-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'services/oglvoice-media/**'
      - '.github/workflows/oglvoice-media-ci.yml'

permissions:
  contents: read

jobs:
  media:
    name: Pion / LiveKit media bridge
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/oglvoice-media

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go from module
        uses: actions/setup-go@v5
        with:
          go-version-file: services/oglvoice-media/go.mod
          cache-dependency-path: services/oglvoice-media/go.mod

      - name: Install libopus build dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libopus-dev

      - name: Resolve pinned dependencies
        shell: bash
        run: go mod tidy

      - name: Validate Go dependency graph
        shell: bash
        run: go mod verify

      - name: Validate Go source
        shell: bash
        run: |
          gofmt -w .
          go vet -tags nolibopusfile -mod=mod ./...

      - name: Media bridge unit and WebRTC integration tests
        shell: bash
        run: go test -tags nolibopusfile -mod=mod -race -count=1 -timeout=3m ./...

      - name: Build OGLVoice media daemon
        shell: bash
        run: go build -tags nolibopusfile -mod=mod -trimpath -o /tmp/oglvoice-media .

      - name: Local daemon configuration-negative smoke
        shell: bash
        run: |
          set +e
          OGLVOICE_MEDIA_ACL_JSON='' /tmp/oglvoice-media >/tmp/oglvoice-media-negative.log 2>&1
          code=$?
          set -e
          test "$code" -ne 0
          grep -F 'configuration rejected' /tmp/oglvoice-media-negative.log
