name: Publish OpenGenesisLINK 0.9.3.8 Stable

# Tag only a successful main push build at the exact tested SHA.
on:
  workflow_run:
    workflows: ["NexVerse CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    name: Publish verified 0.9.3.8 stable release
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CI-tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Verify exact stable commit
        env:
          STABLE_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$STABLE_SHA"
          grep -F 'public const string ProductName = "OpenGenesisLINK";' OpenSim/Framework/VersionInfo.cs
          grep -F 'public const string VersionNumber = "0.9.3.8";' OpenSim/Framework/VersionInfo.cs
          grep -F 'public const Flavour VERSION_FLAVOUR = Flavour.Release;' OpenSim/Framework/VersionInfo.cs
          test -s doc/NexVerse/RELEASE_0.9.3.8.md

      - name: Publish immutable stable release
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v0.9.3.8"
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          if [ "$main_sha" != "$STABLE_SHA" ]; then
            echo "::notice::main moved; stable publication skipped to avoid tagging a stale commit."
            exit 0
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Stable release already exists; immutable publication remains unchanged."
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Stable tag already exists without a release. Refusing to reuse or overwrite it."
            exit 1
          fi
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$STABLE_SHA" \
            --title "OpenGenesisLINK 0.9.3.8" \
            --notes-file doc/NexVerse/RELEASE_0.9.3.8.md \
            --latest
