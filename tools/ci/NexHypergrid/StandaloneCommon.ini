; CI-only destination standalone Hypergrid configuration.

[DatabaseService]
    StorageProvider = "OpenSim.Data.SQLite.dll"
    ConnectionString = "URI=file:/tmp/nexverse-hg-dest.db,version=3,UseUTF16Encoding=True"
    EstateConnectionString = "URI=file:/tmp/nexverse-hg-dest-estate.db,version=3,UseUTF16Encoding=True"

[SimulationDataStore]
    StorageProvider = "OpenSim.Data.SQLite.dll"
    ConnectionString = "URI=file:/tmp/nexverse-hg-dest-sim.db,version=3,UseUTF16Encoding=True"

[EstateDataStore]
    StorageProvider = "OpenSim.Data.SQLite.dll"
    ConnectionString = "URI=file:/tmp/nexverse-hg-dest-estate.db,version=3,UseUTF16Encoding=True"

[AssetService]
    StorageProvider = "OpenSim.Data.SQLite.dll"
    ConnectionString = "URI=file:/tmp/nexverse-hg-dest-assets.db,version=3"
    DefaultAssetLoader = ""

[InventoryService]
    ConnectionString = "URI=file:/tmp/nexverse-hg-dest.db,version=3,UseUTF16Encoding=True"

[AvatarService]
    ConnectionString = "URI=file:/tmp/nexverse-hg-dest.db,version=3"

[AuthenticationService]
    ConnectionString = "URI=file:/tmp/nexverse-hg-dest.db,version=3"

[UserAccountService]
    ConnectionString = "URI=file:/tmp/nexverse-hg-dest.db,version=3"
    CreateDefaultAvatarEntries = false

[GridUserService]
    ConnectionString = "URI=file:/tmp/nexverse-hg-dest.db,version=3"

[FriendsService]
    ConnectionString = "URI=file:/tmp/nexverse-hg-dest.db,version=3"

[Hypergrid]
    GatekeeperURI = "http://127.0.0.1:19300"
    HomeURI = "http://127.0.0.1:19300"

[GridService]
    StorageProvider = "OpenSim.Data.Null.dll:NullRegionData"
    Region_NexVerse_HG_Landing = "DefaultRegion, DefaultHGRegion"

[LoginService]
    EnableNexVerseResidentNames = true
    AllowLoginFallbackToAnyRegion = false
    DOSMaxRequestsInTimeFrame = 0

[GatekeeperService]
    ExternalName = "http://127.0.0.1:19300"
    AllowTeleportsToAnyRegion = true
    ForeignAgentsAllowed = true

[UserAgentService]
    ExternalName = "http://127.0.0.1:19300"
    BypassClientVerification = true

[GridInfoService]
    login = "http://127.0.0.1:19300/"
    gatekeeper = "http://127.0.0.1:19300/"
    gridname = "NexVerse HG Destination CI"
    gridnick = "nexverse-hg-dest"
