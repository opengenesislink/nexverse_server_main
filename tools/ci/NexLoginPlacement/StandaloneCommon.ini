; CI-only standalone service configuration for successful viewer/simulator login placement.
; Copied to bin/config-include/StandaloneCommon.ini only for the duration of the smoke test.

[DatabaseService]
    StorageProvider = "OpenSim.Data.SQLite.dll"
    ConnectionString = "URI=file:/tmp/nexverse-login-placement.db,version=3,UseUTF16Encoding=True"
    EstateConnectionString = "URI=file:/tmp/nexverse-login-placement-estate.db,version=3,UseUTF16Encoding=True"

[AssetService]
    StorageProvider = "OpenSim.Data.SQLite.dll"
    ConnectionString = "URI=file:/tmp/nexverse-login-placement-assets.db,version=3"

[SimulationDataStore]
    StorageProvider = "OpenSim.Data.SQLite.dll"
    ConnectionString = "URI=file:/tmp/nexverse-login-placement-sim.db,version=3,UseUTF16Encoding=True"

[EstateDataStore]
    StorageProvider = "OpenSim.Data.SQLite.dll"
    ConnectionString = "URI=file:/tmp/nexverse-login-placement-estate.db,version=3,UseUTF16Encoding=True"

[InventoryService]
    ConnectionString = "URI=file:/tmp/nexverse-login-placement.db,version=3,UseUTF16Encoding=True"

[AvatarService]
    ConnectionString = "URI=file:/tmp/nexverse-login-placement.db,version=3"

[AuthenticationService]
    ConnectionString = "URI=file:/tmp/nexverse-login-placement.db,version=3"

[UserAccountService]
    ConnectionString = "URI=file:/tmp/nexverse-login-placement.db,version=3"
    CreateDefaultAvatarEntries = false

[GridUserService]
    ConnectionString = "URI=file:/tmp/nexverse-login-placement.db,version=3"

[FriendsService]
    ConnectionString = "URI=file:/tmp/nexverse-login-placement.db,version=3"

[GridService]
    StorageProvider = "OpenSim.Data.Null.dll:NullRegionData"
    Region_NexVerse_CI_Landing = "DefaultRegion, DefaultHGRegion"

[LoginService]
    EnableNexVerseResidentNames = true
    WelcomeMessage = "NexVerse CI successful placement"
    AllowLoginFallbackToAnyRegion = false
    DOSMaxRequestsInTimeFrame = 0

[GridInfoService]
    login = "http://127.0.0.1:19100/"
    gridname = "NexVerse CI"
    gridnick = "nexverse-ci"
